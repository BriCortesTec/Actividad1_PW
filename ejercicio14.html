<body>
    <div class="contenedor">
        <h1>OPERACIONES</h1>
        <p>Ingresa números separados por comas:</p>
        <input type="text" id="entrada" placeholder="Ej: 10, 20, 30, 40">
        
        <button onclick="calcular()" class="boton-calcular">Calcular</button>

        <div class="grupo-doble">
            <p>Número mayor</p>
            <input type="text" id="mayor" readonly>
        </div>
        <div class="grupo-doble">
            <p>Número menor</p>
            <input type="text" id="menor" readonly>

        </div>  
        <div class="grupo-doble">
            <p>Promedio</p>
            <input type="text" id="promedio" readonly>
        </div>
    </div>
